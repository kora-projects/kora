/**
 * Maven-style version parsing and ordering.
 * <p>
 * A version is split into numeric and word items on separators and digit/letter boundaries, so "2.4.3.Final",
 * "6.8.0.RELEASE", "1.0.0-RC1" and "1.0.0.CR1" are all handled. Pre-release markers are whole items, never
 * substrings: "RELEASE" contains "ea" but is not an early-access version.
 */
class CatalogVersion {

    static final int RELEASE_RANK = 6

    /** Pre-release markers and their maturity, lower is less mature. */
    static final Map<String, Integer> PRE_RELEASE_RANKS = [
        dev      : 0, nightly: 0, canary: 0,
        alpha    : 1, a: 1,
        beta     : 2, b: 2,
        milestone: 3, m: 3, preview: 3, pre: 3, ea: 3, eap: 3,
        rc       : 4, cr: 4,
        snapshot : 5,
    ]

    /** Single-letter markers are pre-release only when followed by a number, like "1.0a1" or "1.0.M2". */
    static final Set<String> SHORT_MARKERS = ['a', 'b', 'm'] as Set

    static final Map<String, String> CANONICAL_MARKERS = [a: 'alpha', b: 'beta', m: 'milestone', cr: 'rc']

    /** Words that mean a final release and compare equal to a plain version: "1.0" == "1.0.Final". */
    static final Set<String> RELEASE_WORDS = ['ga', 'final', 'release'] as Set

    static List<Map> items(String version) {
        def tokens = (version.toLowerCase(Locale.ROOT) =~ /\d+|[a-z]+/).collect { it as String }
        def result = []
        tokens.eachWithIndex { String token, int index ->
            if (token ==~ /\d+/) {
                result << [numeric: true, number: new BigInteger(token)]
                return
            }
            def followedByNumber = index + 1 < tokens.size() && tokens[index + 1] ==~ /\d+/
            def preReleaseRank = PRE_RELEASE_RANKS[token]
            if (preReleaseRank != null && (!(token in SHORT_MARKERS) || followedByNumber)) {
                result << [numeric: false, preRelease: true, rank: preReleaseRank, text: CANONICAL_MARKERS[token] ?: token]
            } else if (token in RELEASE_WORDS) {
                result << [numeric: false, preRelease: false, rank: RELEASE_RANK, text: '', word: token]
            } else if (token == 'sp') {
                result << [numeric: false, preRelease: false, rank: RELEASE_RANK + 1, text: token, word: token]
            } else {
                result << [numeric: false, preRelease: false, rank: RELEASE_RANK + 2, text: token, word: token]
            }
        }
        return result
    }

    static int compare(String left, String right) {
        def leftItems = items(left)
        def rightItems = items(right)
        def size = Math.max(leftItems.size(), rightItems.size())
        for (int i = 0; i < size; i++) {
            def leftItem = i < leftItems.size() ? leftItems[i] : null
            def rightItem = i < rightItems.size() ? rightItems[i] : null
            def result = compareItems(leftItem ?: padding(rightItem), rightItem ?: padding(leftItem))
            if (result != 0) {
                return result
            }
        }
        return 0
    }

    /** A missing item is 0 against a number and a final release against a qualifier: "1.0" == "1.0.0", "1.0" > "1.0-rc1". */
    private static Map padding(Map other) {
        other.numeric ? [numeric: true, number: BigInteger.ZERO] : [numeric: false, preRelease: false, rank: RELEASE_RANK, text: '']
    }

    private static int compareItems(Map left, Map right) {
        if (left.numeric && right.numeric) {
            return left.number <=> right.number
        }
        if (left.numeric) {
            return 1
        }
        if (right.numeric) {
            return -1
        }
        def byRank = left.rank <=> right.rank
        return byRank != 0 ? byRank : (left.text <=> right.text)
    }

    /** Only concrete versions starting with a digit; ranges, dynamic "1.+" and "latest.release" are not updated. */
    static boolean isSupported(String version) {
        version != null && version ==~ /\d[A-Za-z0-9._+-]*/ && !version.endsWith('+')
    }

    static boolean isPreRelease(String version) {
        items(version).any { it.preRelease }
    }

    static int maturity(String version) {
        def ranks = items(version).findAll { it.preRelease }.collect { it.rank as int }
        return ranks ? ranks.min() : RELEASE_RANK
    }

    /**
     * Variant words of a version that a candidate must keep: -jre stays -jre and never becomes -android.
     * Final release words are not a variant, so "2.4.3.Final" may move to "2.5.0.Beta1" when pre-releases are included.
     */
    static List<String> flavor(String version) {
        items(version).findAll { !it.numeric && !it.preRelease && it.rank != RELEASE_RANK }.collect { it.word as String }
    }

    static List<BigInteger> releaseParts(String version) {
        items(version).takeWhile { it.numeric }.collect { it.number as BigInteger }
    }

    /** Bogus date versions like commons-collections "20040616" must not win over "3.2.2". */
    static boolean isDateLike(String version) {
        def parts = releaseParts(version)
        return parts && parts[0] >= 10_000_000G
    }

    static boolean isAllowedLevel(String current, String candidate, String updateLevel) {
        if (updateLevel in ['any', 'major']) {
            return true
        }
        def currentParts = releaseParts(current)
        def candidateParts = releaseParts(candidate)
        if (!currentParts || !candidateParts || currentParts[0] != candidateParts[0]) {
            return false
        }
        if (updateLevel == 'patch') {
            def currentMinor = currentParts.size() > 1 ? currentParts[1] : 0G
            def candidateMinor = candidateParts.size() > 1 ? candidateParts[1] : 0G
            return currentMinor == candidateMinor
        }
        return true
    }

    /** Newer versions of the same flavor that the update level and pre-release rules allow, ascending. */
    static List<String> candidates(Collection<String> versions, String current, String updateLevel, boolean includePreRelease) {
        def currentFlavor = flavor(current)
        def currentPreRelease = isPreRelease(current)
        def currentMaturity = maturity(current)
        def currentDateLike = isDateLike(current)
        def result = versions.unique(false).findAll { String candidate ->
            isSupported(candidate)
                && compare(candidate, current) > 0
                && flavor(candidate) == currentFlavor
                && (currentDateLike || !isDateLike(candidate))
                && (includePreRelease || !isPreRelease(candidate) || (currentPreRelease && maturity(candidate) >= currentMaturity))
                && isAllowedLevel(current, candidate, updateLevel)
        }
        return result.sort(false) { String left, String right -> compare(left, right) }
    }
}

class HttpSupport {

    static final String USER_AGENT = 'kora-update-libs-versions'
    static final int ATTEMPTS = 3

    /** Retries I/O errors, 408, 429 and 5xx; returns [body] on success or [error] otherwise. */
    static Map request(String method, String url, String body) {
        String lastError = null
        for (int attempt = 1; attempt <= ATTEMPTS; attempt++) {
            HttpURLConnection connection = null
            try {
                connection = (HttpURLConnection) URI.create(url).toURL().openConnection()
                connection.connectTimeout = 10_000
                connection.readTimeout = 30_000
                connection.instanceFollowRedirects = true
                connection.requestMethod = method
                connection.setRequestProperty('User-Agent', USER_AGENT)
                if (body != null) {
                    connection.doOutput = true
                    connection.setRequestProperty('Content-Type', 'application/json')
                    connection.outputStream.withWriter('UTF-8') { it << body }
                }
                def status = connection.responseCode
                if (status >= 200 && status < 300) {
                    return [body: connection.inputStream.getText('UTF-8')]
                }
                lastError = "HTTP ${status}".toString()
                if (!(status == 408 || status == 429 || status >= 500)) {
                    return [error: lastError]
                }
            } catch (IOException e) {
                lastError = "${e.class.simpleName}: ${e.message}".toString()
            } finally {
                connection?.disconnect()
            }
            if (attempt < ATTEMPTS) {
                Thread.sleep(1000L * attempt)
            }
        }
        return [error: lastError]
    }

    static Map parallel(Collection keys, int threads, Closure action) {
        def distinct = keys.unique(false)
        def pool = Executors.newFixedThreadPool(Math.max(1, Math.min(threads, distinct.size())))
        try {
            def futures = distinct.collectEntries { key -> [(key): pool.submit({ action(key) } as Callable)] }
            return futures.collectEntries { key, future -> [(key): future.get()] }
        } finally {
            pool.shutdownNow()
        }
    }
}

gradle.projectsLoaded {
    gradle.rootProject {
        tasks.register("updateLibsVersions") {
            group = "version catalog"
            description = "Checks gradle/libs.versions.toml against Maven metadata and optionally updates it."
            notCompatibleWithConfigurationCache("Reads and rewrites version catalog files and queries remote repositories")

            doLast {
                def options = readOptions(providers, rootProject)

                def policy = readVersionPolicy(options.policyFile)
                if (!policy.levels.isEmpty()) {
                    println "Using version policy ${options.policyFile}:"
                    policy.levels.keySet().sort().each { key -> println "  ${key}: ${policy.levels[key]}" }
                    println ""
                }

                def catalog = readCatalog(options.catalogFile)
                def notes = []
                notes.addAll(catalog.problems)
                def groups = buildVersionGroups(catalog, policy, notes)
                validatePolicyKeys(policy, catalog, groups, notes)

                if (options.reportVulnerabilities) {
                    reportVulnerabilities(vulnerabilityCoordinates(groups), options)
                    if (!options.writeChanges && !options.reportUpdates) {
                        printNotes(notes)
                        return
                    }
                }

                def metadata = fetchMetadata(groups, options)
                def updates = resolveUpdates(groups, metadata, policy, options, notes)
                def buildSrcResult = syncBuildSrcDependencies(options.buildSrcFiles, effectiveVersions(groups, updates), notes)

                printNotes(notes)

                if (options.reportUpdates) {
                    reportUpdates(updates, buildSrcResult, notes, options)
                }

                if (updates.isEmpty() && buildSrcResult.changes.isEmpty()) {
                    println "No version updates found."
                    return
                }

                updates.each { println "${it.group.name}: ${it.group.current} -> ${it.latest}" }
                if (!buildSrcResult.changes.isEmpty()) {
                    println ""
                    println "buildSrc sync:"
                    buildSrcResult.changes.each {
                        println "  buildSrc/${it.file.name} line ${it.line}: ${it.group}:${it.artifact} (${it.alias}) ${it.current} -> ${it.target}"
                    }
                }

                if (!options.writeChanges) {
                    println ""
                    println "Dry run only. Re-run with -PwriteVersions=true to update ${options.catalogFile}."
                    println "Use -PupdateLevel=minor to update only within the current major version."
                    return
                }

                if (!updates.isEmpty()) {
                    updates.each { update ->
                        replaceSpan(catalog.document, update.group.line, update.group.start, update.group.end, update.group.current, update.latest)
                    }
                    writeDocument(catalog.document)
                    println "Updated ${options.catalogFile}"
                }
                buildSrcResult.documents.each { document ->
                    writeDocument(document)
                    println "Updated ${document.file}"
                }
            }
        }
    }
}

Map readOptions(def providers, def rootProject) {
    def property = { String name -> providers.gradleProperty(name).getOrNull() }
    def flag = { String name -> property(name)?.trim()?.toBoolean() ?: false }
    def file = { String name, String defaultPath -> rootProject.file(property(name) ?: defaultPath) }

    def updateLevel = (property("updateLevel") ?: "any").trim().toLowerCase(Locale.ROOT)
    if (!(updateLevel in ["any", "major", "minor", "patch"])) {
        throw new GradleException("Unsupported updateLevel '${updateLevel}'. Use one of: any, major, minor, patch.")
    }
    def httpThreads = (property("httpThreads") ?: "8").trim()
    if (!(httpThreads ==~ /[1-9]\d*/)) {
        throw new GradleException("Unsupported httpThreads '${httpThreads}'. Use a positive number.")
    }

    def catalogFile = file("catalogFile", "gradle/libs.versions.toml")
    if (!catalogFile.isFile()) {
        throw new GradleException("Catalog file not found: ${catalogFile}")
    }
    def buildSrcDir = file("buildSrcDir", "buildSrc")

    return [
        catalogFile            : catalogFile,
        policyFile             : file("versionPolicy", "gradle/libs-version-policy.toml"),
        buildSrcFiles          : ["build.gradle", "build.gradle.kts"].collect { new File(buildSrcDir, it) }.findAll { it.isFile() },
        writeChanges           : flag("writeVersions"),
        includePreRelease      : flag("includePreRelease"),
        reportVulnerabilities  : flag("reportVulnerabilities"),
        reportUpdates          : flag("reportUpdates"),
        updateLevel            : updateLevel,
        vulnerabilityReportFile: file("vulnerabilityReportFile", "build/reports/dependency-vulnerabilities.md"),
        updateReportFile       : file("updateReportFile", "build/reports/dependency-updates.md"),
        mavenRepository        : (property("mavenRepository") ?: "https://repo1.maven.org/maven2").replaceAll('/+$', ''),
        pluginRepository       : (property("pluginRepository") ?: "https://plugins.gradle.org/m2").replaceAll('/+$', ''),
        httpThreads            : httpThreads.toInteger(),
    ]
}

// ---------------------------------------------------------------------------------------------------------------------
// TOML reading and writing
// ---------------------------------------------------------------------------------------------------------------------

Map readDocument(File file) {
    def text = file.getText("UTF-8")
    def bom = text.startsWith("\uFEFF")
    if (bom) {
        text = text.substring(1)
    }
    return [
        file     : file,
        bom      : bom,
        separator: text.contains("\r\n") ? "\r\n" : "\n",
        lines    : text.split(/\r?\n/, -1) as List<String>,
    ]
}

/** Keeps the original line separator, trailing newline and BOM, so only the changed versions show up in a diff. */
void writeDocument(Map document) {
    def text = document.lines.join(document.separator)
    document.file.setText((document.bom ? "\uFEFF" : "") + text, "UTF-8")
}

void replaceSpan(Map document, int line, int start, int end, String expected, String replacement) {
    def text = document.lines[line]
    if (text.substring(start, end) != expected) {
        throw new GradleException("${document.file.name} line ${line + 1} changed while updating: expected '${expected}' at column ${start + 1}")
    }
    document.lines[line] = text.substring(0, start) + replacement + text.substring(end)
}

/** Cuts a trailing TOML comment, keeping '#' inside basic and literal strings. */
String stripComment(String line) {
    def inBasic = false
    def inLiteral = false
    def escaped = false
    for (int i = 0; i < line.length(); i++) {
        def c = line[i]
        if (inBasic) {
            if (escaped) {
                escaped = false
            } else if (c == '\\') {
                escaped = true
            } else if (c == '"') {
                inBasic = false
            }
        } else if (inLiteral) {
            if (c == "'") {
                inLiteral = false
            }
        } else if (c == '"') {
            inBasic = true
        } else if (c == "'") {
            inLiteral = true
        } else if (c == '#') {
            return line.substring(0, i)
        }
    }
    return line
}

/** Parses `key = value` lines of a simple TOML file with their section, joining multi-line arrays. */
List<Map> readTomlEntries(Map document) {
    def entries = []
    def section = null
    def pending = null
    document.lines.eachWithIndex { String rawLine, int index ->
        def content = stripComment(rawLine)
        if (pending != null) {
            pending.value += " " + content.trim()
            if (pending.value.count("[") <= pending.value.count("]")) {
                entries << pending
                pending = null
            }
            return
        }
        if (content.trim().isEmpty()) {
            return
        }
        def sectionMatcher = content =~ /^\s*\[\s*(?:"([^"]+)"|([A-Za-z0-9_.-]+))\s*]\s*$/
        if (sectionMatcher.matches()) {
            section = sectionMatcher.group(1) ?: sectionMatcher.group(2)
            return
        }
        def entryMatcher = content =~ /^\s*(?:"([^"]+)"|([A-Za-z0-9_.-]+))\s*=\s*(.*?)\s*$/
        if (!entryMatcher.matches()) {
            return
        }
        def entry = [
            section   : section,
            key       : entryMatcher.group(1) ?: entryMatcher.group(2),
            value     : entryMatcher.group(3),
            line      : index,
            valueStart: entryMatcher.start(3),
        ]
        if (entry.value.startsWith("[") && entry.value.count("[") > entry.value.count("]")) {
            pending = entry
        } else {
            entries << entry
        }
    }
    if (pending != null) {
        entries << pending
    }
    return entries
}

/** A TOML string value with its position in the line, or null for any other value. */
Map stringValue(String value, int valueStart) {
    def basic = value =~ /^"((?:[^"\\]|\\.)*)"$/
    def matcher = basic.matches() ? basic : (value =~ /^'([^']*)'$/)
    if (!matcher.matches()) {
        return null
    }
    return [text: matcher.group(1), start: valueStart + matcher.start(1), end: valueStart + matcher.end(1)]
}

/** A `key = "text"` field of an inline table with its position in the line, so it can be replaced in place. */
Map tableString(String value, int valueStart, String key) {
    def matcher = value =~ ('(?<=[{,])\\s*' + Pattern.quote(key) + '\\s*=\\s*"((?:[^"\\\\]|\\\\.)*)"')
    if (!matcher.find()) {
        return null
    }
    return [text: matcher.group(1), start: valueStart + matcher.start(1), end: valueStart + matcher.end(1)]
}

/** The body of a nested `key = { ... }` table of an inline table, or null. */
String tableTable(String value, String key) {
    def matcher = value =~ ('(?<=[{,])\\s*' + Pattern.quote(key) + '\\s*=\\s*\\{([^}]*)}')
    return matcher.find() ? matcher.group(1) : null
}

Map readCatalog(File file) {
    def document = readDocument(file)
    def versions = [:]
    def entries = []
    def problems = []

    readTomlEntries(document).each { entry ->
        switch (entry.section) {
            case "versions":
                def string = stringValue(entry.value, entry.valueStart)
                if (string == null) {
                    problems << note(entry.key, "version `${entry.value}` is not a plain version string (rich versions are not supported), so it is not checked")
                } else {
                    versions[entry.key] = [key: entry.key, current: string.text, line: entry.line, start: string.start, end: string.end]
                }
                break
            case "libraries":
            case "plugins":
                def parsed = entry.section == "plugins" ? parsePlugin(entry) : parseLibrary(entry)
                if (parsed == null) {
                    problems << note(entry.key, "unrecognized ${entry.section} entry at line ${entry.line + 1}, so it is not checked")
                } else if (parsed.problem) {
                    problems << note(entry.key, parsed.problem)
                } else {
                    entries << (parsed + [alias: entry.key, line: entry.line])
                }
                break
        }
    }
    return [document: document, versions: versions, entries: entries, problems: problems]
}

Map parseLibrary(Map entry) {
    def shorthand = stringValue(entry.value, entry.valueStart)
    if (shorthand != null) {
        def parts = shorthand.text.split(":", -1)
        if (parts.length < 2 || parts.length > 3 || parts.any { it.isEmpty() }) {
            return null
        }
        def coordinate = [kind: "maven", group: parts[0], artifact: parts[1]]
        if (parts.length == 2) {
            return [coordinate: coordinate]
        }
        return [coordinate: coordinate, version: [text: parts[2], start: shorthand.end - parts[2].length(), end: shorthand.end]]
    }
    if (!entry.value.startsWith("{")) {
        return null
    }
    def module = tableString(entry.value, entry.valueStart, "module")
    def coordinate
    if (module != null) {
        def parts = module.text.split(":", -1)
        if (parts.length != 2 || parts.any { it.isEmpty() }) {
            return null
        }
        coordinate = [kind: "maven", group: parts[0], artifact: parts[1]]
    } else {
        def group = tableString(entry.value, entry.valueStart, "group")
        def name = tableString(entry.value, entry.valueStart, "name")
        if (group == null || name == null) {
            return null
        }
        coordinate = [kind: "maven", group: group.text, artifact: name.text]
    }
    return withVersion(entry, coordinate)
}

Map parsePlugin(Map entry) {
    def shorthand = stringValue(entry.value, entry.valueStart)
    if (shorthand != null) {
        def separator = shorthand.text.lastIndexOf(":")
        if (separator <= 0 || separator == shorthand.text.length() - 1) {
            return null
        }
        def version = shorthand.text.substring(separator + 1)
        return [coordinate: pluginCoordinate(shorthand.text.substring(0, separator)), version: [text: version, start: shorthand.end - version.length(), end: shorthand.end]]
    }
    if (!entry.value.startsWith("{")) {
        return null
    }
    def id = tableString(entry.value, entry.valueStart, "id")
    return id == null ? null : withVersion(entry, pluginCoordinate(id.text))
}

Map pluginCoordinate(String id) {
    [kind: "plugin", group: id, artifact: "${id}.gradle.plugin".toString()]
}

Map withVersion(Map entry, Map coordinate) {
    def versionRef = tableString(entry.value, entry.valueStart, "version.ref")
    if (versionRef != null) {
        return [coordinate: coordinate, versionRef: versionRef.text]
    }
    def version = tableString(entry.value, entry.valueStart, "version")
    if (version != null) {
        return [coordinate: coordinate, version: version]
    }
    def richVersion = tableTable(entry.value, "version")
    if (richVersion != null) {
        def ref = richVersion =~ /(?:^|,)\s*ref\s*=\s*"([^"]+)"/
        if (ref.find()) {
            return [coordinate: coordinate, versionRef: ref.group(1)]
        }
        return [problem: "rich version `{${richVersion.trim()}}` is not supported, so it is not checked"]
    }
    // no version: managed by a platform or BOM
    return [coordinate: coordinate]
}

Map note(def subject, def message) {
    [subject: subject.toString(), message: message.toString()]
}

// ---------------------------------------------------------------------------------------------------------------------
// Version policy
// ---------------------------------------------------------------------------------------------------------------------

Map readVersionPolicy(File policyFile) {
    def policy = [levels: [:], coordinates: [:]]
    if (!policyFile.isFile()) {
        return policy
    }
    readTomlEntries(readDocument(policyFile)).each { entry ->
        switch (entry.section) {
            case "version-levels":
                def level = stringValue(entry.value, 0)?.text
                if (!(level in ["any", "major", "minor", "patch"])) {
                    throw new GradleException("Invalid version policy line in ${policyFile} line ${entry.line + 1}: ${entry.key} = ${entry.value}. Use any, major, minor or patch.")
                }
                policy.levels[entry.key] = level
                break
            case "version-coordinates":
                def values = entry.value.startsWith("[")
                    ? (entry.value =~ /"([^"]*)"/).collect { it[1] as String }
                    : [stringValue(entry.value, 0)?.text]
                def coordinates = values.collect { parsePolicyCoordinate(it) }
                if (coordinates.isEmpty() || coordinates.any { it == null }) {
                    throw new GradleException("Invalid version coordinates in ${policyFile} line ${entry.line + 1}: ${entry.key} = ${entry.value}. Use \"group:artifact\" or \"plugin:<plugin id>\".")
                }
                policy.coordinates[entry.key] = coordinates
                break
        }
    }
    return policy
}

Map parsePolicyCoordinate(String value) {
    if (value == null) {
        return null
    }
    if (value.startsWith("plugin:")) {
        def id = value.substring("plugin:".length())
        return id ? pluginCoordinate(id) : null
    }
    def parts = value.split(":", -1)
    return parts.length == 2 && parts.every { it } ? [kind: "maven", group: parts[0], artifact: parts[1]] : null
}

String effectiveUpdateLevel(String requestedLevel, String policyLevel) {
    if (!policyLevel) {
        return requestedLevel
    }
    def order = ["patch", "minor", "major", "any"]
    return order[Math.min(order.indexOf(requestedLevel), order.indexOf(policyLevel))]
}

void logPolicyRestriction(String key, String requestedLevel, String policyLevel, String effectiveLevel) {
    if (policyLevel && policyLevel != requestedLevel) {
        println "Policy ${key}: requested=${requestedLevel}, policy=${policyLevel}, effective=${effectiveLevel}"
    } else if (policyLevel) {
        println "Policy ${key}: ${effectiveLevel}"
    }
}

void validatePolicyKeys(Map policy, Map catalog, List<Map> groups, List notes) {
    def known = (catalog.versions.keySet() + groups.collectMany { it.policyKeys }) as Set
    (policy.levels.keySet() + policy.coordinates.keySet()).unique().findAll { !(it in known) }.each {
        notes << note(it, "version policy key matches no `[versions]` key or inline catalog entry")
    }
}

// ---------------------------------------------------------------------------------------------------------------------
// Version groups: every version value together with all artifacts that must move with it
// ---------------------------------------------------------------------------------------------------------------------

List<Map> buildVersionGroups(Map catalog, Map policy, List notes) {
    def groups = []
    def byKey = [:]
    catalog.versions.values().each { version ->
        def group = [name: version.key, policyKeys: [version.key], current: version.current,
                     line: version.line, start: version.start, end: version.end, coordinates: []]
        byKey[version.key] = group
        groups << group
    }

    catalog.entries.each { entry ->
        def coordinate = entry.coordinate
        if (entry.versionRef) {
            def group = byKey[entry.versionRef]
            if (group == null) {
                notes << note(entry.alias, "version.ref `${entry.versionRef}` has no entry in `[versions]`")
            } else {
                addCoordinate(group, coordinate, entry.alias)
            }
        } else if (entry.version) {
            def inlineKey = "inline:${entry.line + 1}".toString()
            def group = [name: "${entry.alias} (${coordinateName(coordinate)}, ${inlineKey})".toString(), policyKeys: [entry.alias, inlineKey],
                         current: entry.version.text, line: entry.line, start: entry.version.start, end: entry.version.end, coordinates: []]
            addCoordinate(group, coordinate, entry.alias)
            groups << group
        }
    }

    // versions used only through `libs.versions.*` in build scripts need explicit coordinates to be checked
    groups.findAll { it.coordinates.isEmpty() }.each { group ->
        def mapped = policy.coordinates[group.name]
        if (mapped) {
            mapped.each { addCoordinate(group, it, group.name) }
        } else {
            notes << note(group.name, "no library or plugin references this version and the version policy has no `[version-coordinates]` entry for it, so it is not checked")
        }
    }
    return groups.findAll { !it.coordinates.isEmpty() }.sort { it.line }
}

void addCoordinate(Map group, Map coordinate, String alias) {
    def existing = group.coordinates.find { it.kind == coordinate.kind && it.group == coordinate.group && it.artifact == coordinate.artifact }
    if (existing) {
        existing.aliases << alias
    } else {
        group.coordinates << (coordinate + [aliases: [alias] as LinkedHashSet])
    }
}

String coordinateName(Map coordinate) {
    coordinate.kind == "plugin" ? "plugin ${coordinate.group}".toString() : "${coordinate.group}:${coordinate.artifact}".toString()
}

String metadataUrl(Map coordinate, Map options) {
    def repository = coordinate.kind == "plugin" ? options.pluginRepository : options.mavenRepository
    "${repository}/${coordinate.group.replace('.', '/')}/${coordinate.artifact}/maven-metadata.xml".toString()
}

Map fetchMetadata(List<Map> groups, Map options) {
    def urls = groups.collectMany { group -> group.coordinates.collect { metadataUrl(it, options) } }.unique()
    println "Reading Maven metadata for ${urls.size()} coordinates..."
    return HttpSupport.parallel(urls, options.httpThreads) { String url -> readMetadata(url) }
}

Map readMetadata(String url) {
    def response = HttpSupport.request("GET", url, null)
    if (response.error) {
        return [versions: [], error: response.error]
    }
    try {
        def metadata = new XmlSlurper(false, false, false).parseText(response.body)
        def versions = metadata.versioning.versions.version.collect { it.text().trim() }
        [metadata.versioning.release.text(), metadata.versioning.latest.text()].each {
            if (it?.trim()) {
                versions << it.trim()
            }
        }
        return [versions: versions.findAll().unique(), error: null]
    } catch (Exception e) {
        return [versions: [], error: "invalid metadata: ${e.message}".toString()]
    }
}

List<Map> resolveUpdates(List<Map> groups, Map metadata, Map policy, Map options, List notes) {
    def updates = []
    groups.each { group ->
        def policyKey = group.policyKeys.find { policy.levels[it] }
        def policyLevel = policyKey ? policy.levels[policyKey] : null
        def updateLevel = effectiveUpdateLevel(options.updateLevel, policyLevel)
        logPolicyRestriction(policyKey ?: group.name, options.updateLevel, policyLevel, updateLevel)

        if (!CatalogVersion.isSupported(group.current)) {
            notes << note(group.name, "version `${group.current}` is not a concrete version, so it is not checked")
            return
        }

        def perCoordinate = group.coordinates.collect { coordinate ->
            def result = metadata[metadataUrl(coordinate, options)]
            [coordinate: coordinate, versions: result.versions, error: result.error]
        }
        def failed = perCoordinate.findAll { it.error }
        if (failed) {
            failed.each { notes << note(group.name, "metadata of ${coordinateName(it.coordinate)} is unavailable (${it.error}), so the version is not checked") }
            return
        }
        perCoordinate.findAll { !(group.current in it.versions) }.each {
            notes << note(group.name, "current version `${group.current}` is not listed in the metadata of ${coordinateName(it.coordinate)}")
        }

        perCoordinate.each { it.candidates = CatalogVersion.candidates(it.versions, group.current, updateLevel, options.includePreRelease) }
        // a shared version may only move to a release that exists for every artifact using it
        def common = perCoordinate.collect { it.candidates }.inject { left, right -> left.findAll { it in right } }
        if (common.isEmpty()) {
            def ahead = perCoordinate.findAll { !it.candidates.isEmpty() }
            if (ahead) {
                def behind = perCoordinate.findAll { it.candidates.isEmpty() }
                notes << note(group.name, "newer versions exist for ${ahead.collect { "${coordinateName(it.coordinate)} (${it.candidates.last()})" }.join(", ")}, " +
                    "but not for ${behind.collect { coordinateName(it.coordinate) }.join(", ")}, so the shared version is not updated")
            }
            return
        }
        updates << [group: group, latest: common.last()]
    }
    return updates
}

/** The version every Maven coordinate ends up with after the updates, for buildSrc synchronization. */
Map effectiveVersions(List<Map> groups, List<Map> updates) {
    def latestByGroup = new IdentityHashMap()
    updates.each { latestByGroup.put(it.group, it.latest) }
    def result = [:]
    groups.each { group ->
        group.coordinates.findAll { it.kind == "maven" }.each { coordinate ->
            def key = "${coordinate.group}:${coordinate.artifact}".toString()
            if (!result.containsKey(key)) {
                result[key] = [version: latestByGroup.get(group) ?: group.current, alias: coordinate.aliases.first()]
            }
        }
    }
    return result
}

void printNotes(List notes) {
    if (notes.isEmpty()) {
        return
    }
    println ""
    notes.unique(false).each { println "WARN: ${it.subject}: ${it.message}" }
    println ""
}

// ---------------------------------------------------------------------------------------------------------------------
// buildSrc synchronization
// ---------------------------------------------------------------------------------------------------------------------

Map syncBuildSrcDependencies(List<File> files, Map catalogVersions, List notes) {
    def changes = []
    def missing = []
    def documents = []
    files.each { file ->
        def document = readDocument(file)
        def fileChanges = []
        document.lines.eachWithIndex { String line, int index ->
            def trimmed = line.trim()
            if (trimmed.startsWith("//") || trimmed.startsWith("*")) {
                return
            }
            def matcher = line =~ /(['"])([A-Za-z0-9_.-]+):([A-Za-z0-9_.-]+):([A-Za-z0-9_.+-]+)\1/
            while (matcher.find()) {
                def key = "${matcher.group(2)}:${matcher.group(3)}".toString()
                def current = matcher.group(4)
                def catalogEntry = catalogVersions[key]
                if (catalogEntry == null) {
                    missing << [file: file, line: index + 1, group: matcher.group(2), artifact: matcher.group(3), current: current]
                    notes << note("buildSrc/${file.name}", "no libs.versions.toml entry for ${key}:${current}")
                } else if (catalogEntry.version != current) {
                    fileChanges << [file : file, line: index + 1, lineIndex: index, start: matcher.start(4), end: matcher.end(4),
                                    group: matcher.group(2), artifact: matcher.group(3), current: current, target: catalogEntry.version, alias: catalogEntry.alias]
                }
            }
        }
        // replace from the end of a line so the other spans of the same line stay valid
        fileChanges.sort(false) { -it.start }.each { replaceSpan(document, it.lineIndex, it.start, it.end, it.current, it.target) }
        if (fileChanges) {
            documents << document
            changes.addAll(fileChanges.sort(false) { it.line })
        }
    }
    return [changes: changes, missing: missing, documents: documents]
}

// ---------------------------------------------------------------------------------------------------------------------
// Reports
// ---------------------------------------------------------------------------------------------------------------------

void reportUpdates(List<Map> updates, Map buildSrcResult, List notes, Map options) {
    def totalCount = updates.size() + buildSrcResult.changes.size()

    def markdown = []
    markdown << "<!-- kora-dependency-update-report -->"
    markdown << "## Dependency Update Report"
    markdown << ""
    markdown << "Update level: `${options.updateLevel}`"
    markdown << ""

    if (totalCount == 0) {
        markdown << "No dependency updates found."
        markdown << ""
    } else {
        markdown << "**Found `${totalCount}` dependency updates.**"
        markdown << ""
        if (!updates.isEmpty()) {
            markdown << "### `gradle/libs.versions.toml`"
            markdown << ""
            updates.each { markdown << "- `${it.group.name}`: `${it.group.current}` -> `${it.latest}`" }
            markdown << ""
        }
        if (!buildSrcResult.changes.isEmpty()) {
            markdown << "### `buildSrc`"
            markdown << ""
            buildSrcResult.changes.each {
                markdown << "- `buildSrc/${it.file.name}` line `${it.line}`: `${it.group}:${it.artifact}` (`${it.alias}`) `${it.current}` -> `${it.target}`"
            }
            markdown << ""
        }
    }

    if (buildSrcResult.missing) {
        markdown << "### `buildSrc` dependencies not in catalog"
        markdown << ""
        buildSrcResult.missing.each { markdown << "- `buildSrc/${it.file.name}` line `${it.line}`: `${it.group}:${it.artifact}:${it.current}`" }
        markdown << ""
    }

    def checkNotes = notes.unique(false).findAll { !it.message.startsWith("no libs.versions.toml entry") }
    if (checkNotes) {
        markdown << "### Not checked or not updated"
        markdown << ""
        checkNotes.each { markdown << "- `${it.subject}`: ${it.message}" }
        markdown << ""
    }

    writeReport(options.updateReportFile, markdown)
    println "Wrote dependency update report to ${options.updateReportFile}"
}

void writeReport(File reportFile, List markdown) {
    reportFile.parentFile.mkdirs()
    def lines = markdown.collect { it.toString() }
    while (lines && lines.last() == "") {
        lines.remove(lines.size() - 1)
    }
    reportFile.write(lines.join("\n") + "\n", "UTF-8")
}

// ---------------------------------------------------------------------------------------------------------------------
// Vulnerabilities via OSV.dev
// ---------------------------------------------------------------------------------------------------------------------

List<Map> vulnerabilityCoordinates(List<Map> groups) {
    def coordinates = [:]
    groups.findAll { CatalogVersion.isSupported(it.current) }.each { group ->
        group.coordinates.findAll { it.kind == "maven" }.each { coordinate ->
            def key = "${coordinate.group}:${coordinate.artifact}:${group.current}".toString()
            if (!coordinates.containsKey(key)) {
                coordinates[key] = [group: coordinate.group, artifact: coordinate.artifact, version: group.current, aliases: [] as Set]
            }
            coordinates[key].aliases.addAll(coordinate.aliases)
        }
    }
    return coordinates.keySet().sort().collect { coordinates[it] }
}

void reportVulnerabilities(List<Map> coordinates, Map options) {
    println "Vulnerability report via OSV.dev for ${coordinates.size()} Maven coordinates:"
    println ""
    def markdown = []
    markdown << "<!-- kora-dependency-vulnerability-report -->"
    markdown << "## Dependency Vulnerability Report"
    markdown << ""
    markdown << "Checked `${coordinates.size()}` Maven coordinates from `gradle/libs.versions.toml` via OSV.dev."
    markdown << ""

    def keys = coordinates.collect { "${it.group}:${it.artifact}:${it.version}".toString() }
    def byKey = [keys, coordinates].transpose().collectEntries { [(it[0]): it[1]] }
    def responses = HttpSupport.parallel(keys, options.httpThreads) { String key -> queryOsv(byKey[key]) }
    def vulnerableCount = 0
    def vulnerabilityCount = 0
    def failed = []

    keys.each { key ->
        def coordinate = byKey[key]
        def response = responses[key]
        if (response.error) {
            failed << "${key} (${response.error})"
            return
        }
        def vulnerabilities = response.vulns.findAll { isOsvVulnerabilityApplicable(it, coordinate) }
        if (vulnerabilities.isEmpty()) {
            return
        }

        vulnerableCount++
        vulnerabilityCount += vulnerabilities.size()
        def aliases = coordinate.aliases.sort()
        println "${key} (${aliases.join(', ')})"
        markdown << "### `${key}`"
        markdown << ""
        markdown << "Aliases: `${aliases.join('`, `')}`"
        markdown << ""
        vulnerabilities.sort { it.id ?: "" }.each { vulnerability ->
            def ids = []
            if (vulnerability.id) {
                ids << vulnerability.id
            }
            if (vulnerability.aliases instanceof Collection) {
                ids.addAll(vulnerability.aliases.findAll { it ==~ /CVE-\d{4}-\d+/ })
            }
            ids = ids.unique()
            def summary = vulnerability.summary ?: "(no summary)"
            def affected = affectedRangeSummary(vulnerability, coordinate)
            println "  - ${ids.join(', ')}: ${summary}"
            markdown << "- `${ids.join('`, `')}`: ${summary}"
            if (affected) {
                println "    affected: ${affected}"
                markdown << "  - Affected range: `${affected}`"
            }
        }
        println ""
        markdown << ""
    }

    if (vulnerableCount == 0) {
        println "No vulnerabilities found."
        markdown << "No vulnerabilities found."
        markdown << ""
    } else {
        println "Found ${vulnerabilityCount} vulnerabilities across ${vulnerableCount} coordinates."
        markdown.add(3, "**Found `${vulnerabilityCount}` vulnerabilities across `${vulnerableCount}` coordinates.**")
        markdown.add(4, "")
    }

    if (failed) {
        println ""
        failed.each { println "WARN: Unable to query OSV for ${it}" }
        markdown << "### Not checked"
        markdown << ""
        failed.each { markdown << "- `${it}`" }
        markdown << ""
    }

    writeReport(options.vulnerabilityReportFile, markdown)
    println "Wrote vulnerability report to ${options.vulnerabilityReportFile}"
}

Map queryOsv(Map coordinate) {
    def results = []
    String pageToken = null
    while (true) {
        def payload = [package: [name: "${coordinate.group}:${coordinate.artifact}".toString(), ecosystem: "Maven"], version: coordinate.version]
        if (pageToken) {
            payload.page_token = pageToken
        }
        def response = HttpSupport.request("POST", "https://api.osv.dev/v1/query", JsonOutput.toJson(payload))
        if (response.error) {
            return [vulns: results, error: response.error]
        }
        def json = new JsonSlurper().parseText(response.body)
        if (json.vulns instanceof Collection) {
            results.addAll(json.vulns)
        }
        pageToken = json.next_page_token
        if (!pageToken) {
            return [vulns: results, error: null]
        }
    }
}

boolean isOsvVulnerabilityApplicable(Map vulnerability, Map coordinate) {
    // no Maven block for this exact package: keep the conservative answer OSV gave for the query
    if (matchingPackageBlocks(vulnerability, coordinate).isEmpty()) {
        return true
    }
    return !applicableAffectedBlocks(vulnerability, coordinate).isEmpty()
}

List matchingPackageBlocks(Map vulnerability, Map coordinate) {
    if (!(vulnerability.affected instanceof Collection)) {
        return []
    }
    def packageName = "${coordinate.group}:${coordinate.artifact}".toString()
    vulnerability.affected.findAll { block -> block.package?.ecosystem == "Maven" && block.package?.name == packageName }
}

List applicableAffectedBlocks(Map vulnerability, Map coordinate) {
    def version = coordinate.version
    matchingPackageBlocks(vulnerability, coordinate).findAll { block ->
        def explicitRange = block.database_specific?.last_known_affected_version_range
        if (explicitRange && !isVersionInSimpleRange(version, explicitRange)) {
            return false
        }
        def versions = block.versions instanceof Collection ? block.versions : []
        if (versions.contains(version)) {
            return true
        }
        def ranges = block.ranges instanceof Collection ? block.ranges.findAll { it.type in ["ECOSYSTEM", "SEMVER"] } : []
        if (!ranges.isEmpty()) {
            return ranges.any { isVersionAffectedByEvents(version, it.events) }
        }
        // neither a matching version list nor ranges: only a block without any data means the whole package
        return versions.isEmpty() && !(block.ranges instanceof Collection && !block.ranges.isEmpty())
    }
}

/** OSV range evaluation: events are ordered by version and the last event at or below the version decides. */
boolean isVersionAffectedByEvents(String version, def events) {
    if (!(events instanceof Collection)) {
        return false
    }
    def boundary = { Map event -> event.introduced ?: event.fixed ?: event.last_affected ?: event.limit }
    def sorted = events.findAll { boundary(it) != null }.sort(false) { left, right ->
        def leftBoundary = boundary(left)
        def rightBoundary = boundary(right)
        if (leftBoundary == "0" || rightBoundary == "0") {
            return (leftBoundary == "0" ? 0 : 1) <=> (rightBoundary == "0" ? 0 : 1)
        }
        return CatalogVersion.compare(leftBoundary, rightBoundary)
    }
    def affected = false
    sorted.each { event ->
        if (event.introduced != null) {
            if (event.introduced == "0" || CatalogVersion.compare(version, event.introduced) >= 0) {
                affected = true
            }
        } else if (event.fixed != null) {
            if (CatalogVersion.compare(version, event.fixed) >= 0) {
                affected = false
            }
        } else if (event.last_affected != null) {
            if (CatalogVersion.compare(version, event.last_affected) > 0) {
                affected = false
            }
        } else if (event.limit != null) {
            if (CatalogVersion.compare(version, event.limit) >= 0) {
                affected = false
            }
        }
    }
    return affected
}

String affectedRangeSummary(Map vulnerability, Map coordinate) {
    def version = coordinate.version
    def summaries = applicableAffectedBlocks(vulnerability, coordinate).collect { block ->
        def explicitRange = block.database_specific?.last_known_affected_version_range
        if (explicitRange) {
            return explicitRange
        }
        def events = block.ranges instanceof Collection ? block.ranges.collectMany { it.events instanceof Collection ? it.events : [] } : []
        def fixed = events.collect { it.fixed }.findAll { it && CatalogVersion.compare(it, version) > 0 }
        if (fixed) {
            return "< ${fixed.min { left, right -> CatalogVersion.compare(left, right) }}".toString()
        }
        def lastAffected = events.collect { it.last_affected }.findAll { it && CatalogVersion.compare(it, version) >= 0 }
        if (lastAffected) {
            return "<= ${lastAffected.max { left, right -> CatalogVersion.compare(left, right) }}".toString()
        }
        return null
    }.findAll().unique()
    return summaries.join(", ")
}

/** Ranges like "< 2.3.4", "<= 2.3.4" or ">= 2.0, < 2.3.4"; an unknown format does not filter anything out. */
boolean isVersionInSimpleRange(String version, String range) {
    def parsed = range.split(",").collect { it.trim() }.findAll().collect { it =~ /^(<=|>=|<|>|==?)\s*([A-Za-z0-9_.+-]+)$/ }
    if (parsed.isEmpty() || parsed.any { !it.matches() }) {
        return true
    }
    return parsed.every { matcher ->
        def compared = CatalogVersion.compare(version, matcher.group(2))
        switch (matcher.group(1)) {
            case "<": return compared < 0
            case "<=": return compared <= 0
            case ">": return compared > 0
            case ">=": return compared >= 0
            default: return compared == 0
        }
    }
}
