syntax = "proto3";

package lower.v1;

option java_multiple_files = true;
option java_package = "io.koraframework.grpc.client.lower";

service lowerEvents {
    rpc send (LowerRequest) returns (LowerResponse) {
    }
}
message LowerRequest {
    string event = 1;
}
message LowerResponse {
    string res = 1;
}
