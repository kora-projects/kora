openapi: 3.0.3

info:
  title: Petstore form object with a nested object
  version: 1.0.0

paths:
  /form-urlencoded-nested-object:
    post:
      operationId: submitProfile
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                profile:
                  $ref: '#/components/schemas/Profile'
      responses:
        '204':
          description: Submitted

components:
  schemas:
    Profile:
      type: object
      properties:
        login:
          type: string
        contact:
          $ref: '#/components/schemas/Contact'
    Contact:
      type: object
      properties:
        email:
          type: string
