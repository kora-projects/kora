openapi: 3.0.3
info:
  title: Form params validation
  version: 1.0.0
paths:
  /shelves/form:
    post:
      tags: [ shelves ]
      operationId: submitShelf
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [ name, size ]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 10
                  pattern: "^[a-z]+$"
                size:
                  type: integer
                  minimum: 18
      responses:
        "204":
          description: OK
  /shelves/upload:
    post:
      tags: [ shelves ]
      operationId: uploadShelf
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ title, file ]
              properties:
                title:
                  type: string
                  maxLength: 5
                file:
                  type: string
                  format: binary
      responses:
        "204":
          description: OK
