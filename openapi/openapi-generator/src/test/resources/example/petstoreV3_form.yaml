openapi: 3.0.3

info:
  title: Petstore with discriminator
  version: 1.0.0

paths:
  /form-urlencoded:
    patch:
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                pet:
                  type: string
      responses:
        '200':
          description: Updated

  /form-urlencoded-object:
    patch:
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ObjectForm'
      responses:
        '200':
          description: Updated

  /form-urlencoded-with-json-schema:
    patch:
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                pet:
                  $ref: '#/components/schemas/Pet'
            encoding:
              pet:
                contentType: 'application/json'
      responses:
        '200':
          description: Updated

  /form-urlencoded-with-unknown-schema:
    patch:
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                pet:
                  $ref: '#/components/schemas/Pet'
            encoding:
              pet:
                contentType: 'text/xml'
      responses:
        '200':
          description: Updated

  /form-multipart-form-data-with-object:
    patch:
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated


  /form-multipart-form-data-with-array:
    patch:
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                filename:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Updated

  /form-multipart-form-data-with-enum:
    patch:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - account
                - type
              properties:
                account:
                  type: string
                type:
                  $ref: '#/components/schemas/CurrencyType'
      responses:
        '200':
          description: Updated

  /form-multipart-form-data-with-model:
    patch:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - info
              properties:
                name:
                  type: string
                info:
                  $ref: '#/components/schemas/Info'
      responses:
        '200':
          description: Updated

  /form-multipart-form-data-with-primitives:
    patch:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - active
                - count
              properties:
                active:
                  type: boolean
                count:
                  type: integer
                  format: int32
                rating:
                  type: number
                  format: double
      responses:
        '200':
          description: Updated

  /form-multipart-form-data-with-string-array:
    patch:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - tags
              properties:
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Updated

  /form-multipart-form-data-with-int-array:
    patch:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - counts
              properties:
                counts:
                  type: array
                  items:
                    type: integer
                    format: int32
      responses:
        '200':
          description: Updated

  /form-multipart-form-data-with-bool-array:
    patch:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - flags
              properties:
                flags:
                  type: array
                  items:
                    type: boolean
      responses:
        '200':
          description: Updated

  /form-multipart-form-data-with-enum-array:
    patch:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - types
              properties:
                types:
                  type: array
                  items:
                    $ref: '#/components/schemas/CurrencyType'
      responses:
        '200':
          description: Updated

  /form-multipart-form-data-with-model-array:
    patch:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - infos
              properties:
                infos:
                  type: array
                  items:
                    $ref: '#/components/schemas/Info'
      responses:
        '200':
          description: Updated

  /form-multipart-form-data-with-optional-array:
    patch:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                labels:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Updated

  /form-image:
    patch:
      requestBody:
        content:
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Updated


components:
  schemas:
    Pet:
      type: object
      required:
        - pet_type
        - provided
        - srcCurrency
        - amount
        - currency
      properties:
        pet_type:
          type: string
        provided:
          type: boolean
        srcCurrency:
          type: integer
          format: int32
        dstCurrency:
          type: integer
          format: int64
        amount:
          type: number
        currency:
          type: string
          enum: [ RUB, USD, CNY ]
    ObjectForm:
      type: object
      required:
        - account
        - amount
        - currency
      properties:
        account:
          type: string
        provided:
          type: boolean
        srcCurrency:
          type: integer
          format: int32
        dstCurrency:
          type: integer
          format: int64
        amount:
          type: number
        currency:
          type: string
          enum: [ RUB, USD, CNY ]
        type:
          $ref: '#/components/schemas/CurrencyType'
        info:
          $ref: "#/components/schemas/Info"
    Info:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    CurrencyType:
      type: string
      enum:
        - GOOD
        - BAD
