openapi: 3.0.3

info:
  title: Server form request mappers
  version: 1.0.0

paths:
  /form-urlencoded-optional:
    patch:
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                count:
                  type: integer
                  format: int32
                tags:
                  type: array
                  items:
                    type: string
                ids:
                  type: array
                  items:
                    type: integer
                    format: int32
      responses:
        '200':
          description: Updated

  /form-multipart-json-part:
    patch:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - meta
              properties:
                file:
                  type: string
                  format: binary
                meta:
                  $ref: '#/components/schemas/Info'
                encodedMeta:
                  $ref: '#/components/schemas/Info'
                plainMeta:
                  $ref: '#/components/schemas/Info'
                type:
                  $ref: '#/components/schemas/CurrencyType'
                problemMeta:
                  $ref: '#/components/schemas/Info'
                jsonNote:
                  type: string
                nestedMetas:
                  type: array
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Info'
            encoding:
              encodedMeta:
                contentType: 'application/json'
              plainMeta:
                contentType: 'text/plain'
              problemMeta:
                contentType: 'application/problem+json'
              jsonNote:
                contentType: 'application/json'
      responses:
        '200':
          description: Updated

  /form-urlencoded-array-styles:
    patch:
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [address]
              properties:
                tags:
                  type: array
                  items:
                    type: string
                csv:
                  type: array
                  items:
                    type: integer
                    format: int32
                pipes:
                  type: array
                  items:
                    type: string
                spaces:
                  type: array
                  items:
                    type: string
                owner:
                  $ref: '#/components/schemas/Owner'
                address:
                  $ref: '#/components/schemas/Address'
                jsonOwner:
                  $ref: '#/components/schemas/Owner'
            encoding:
              jsonOwner:
                contentType: application/json
              csv:
                style: form
                explode: false
              pipes:
                style: pipeDelimited
                explode: false
              spaces:
                style: spaceDelimited
      responses:
        '200':
          description: Updated

  /form-urlencoded-and-multipart:
    patch:
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BothForm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BothForm'
      responses:
        '200':
          description: Updated

  /form-multipart-model-array:
    patch:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                metas:
                  type: array
                  items:
                    $ref: '#/components/schemas/Info'
      responses:
        '200':
          description: Updated

  /form-urlencoded-byte:
    patch:
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - req
              properties:
                req:
                  type: string
                  format: byte
                opt:
                  type: string
                  format: byte
                chunks:
                  type: array
                  items:
                    type: string
                    format: byte
      responses:
        '200':
          description: Updated

  /form-urlencoded-binary:
    patch:
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - doc
              properties:
                doc:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated

components:
  schemas:
    Owner:
      type: object
      required: [ownerName]
      properties:
        ownerName:
          type: string
        age:
          type: integer
          format: int32
        nick:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
        scores:
          type: array
          items:
            type: integer
            format: int32
        level:
          $ref: '#/components/schemas/CurrencyType'
        mode:
          type: string
          enum: [fast, slow]
    Address:
      type: object
      required: [city, zip]
      properties:
        city:
          type: string
        zip:
          type: integer
          format: int32
    BothForm:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        count:
          type: integer
          format: int32
        file:
          type: string
          format: binary
        files:
          type: array
          items:
            type: string
            format: binary
    Info:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    CurrencyType:
      type: string
      enum:
        - GOOD
        - BAD
