openapi: 3.0.3

info:
  title: A subtype declares a property of its discriminator parent with another type
  version: 1.0.0

paths:
  /nodes:
    post:
      operationId: postNode
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
      responses:
        '200':
          description: ok

components:
  schemas:
    Node:
      type: object
      required: [ type, weight ]
      discriminator:
        propertyName: type
        mapping:
          leaf: '#/components/schemas/NodeLeaf'
      properties:
        type:
          type: string
        weight:
          type: integer

    NodeLeaf:
      allOf:
        - $ref: '#/components/schemas/Node'
        - type: object
          properties:
            weight:
              type: string
