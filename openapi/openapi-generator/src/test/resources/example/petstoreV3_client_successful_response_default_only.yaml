openapi: 3.0.3

info:
  title: Client successful response mode with only a default response
  version: 1.0.0

paths:
  /pets:
    get:
      operationId: getPet
      tags:
        - pets
      responses:
        default:
          description: Any response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
