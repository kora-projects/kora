openapi: 3.0.3
info:
  title: Combined validation
  version: 1.0.0
paths:
  /orders:
    post:
      tags: [ orders ]
      operationId: createOrder
      parameters:
        - name: discount
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: reference
          in: query
          required: false
          schema:
            type: string
            maxLength: 16
            pattern: "^[A-Z]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "200":
          description: OK
components:
  schemas:
    Order:
      type: object
      required: [ amount, code, lines ]
      properties:
        amount:
          type: number
          minimum: 0
        fee:
          type: number
          minimum: 0.5
        temperature:
          type: number
          format: double
          maximum: 10
        ratio:
          type: number
          format: double
          minimum: 0.5
          maximum: 10.5
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ".*\\S.*"
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Line"
    Line:
      type: object
      required: [ sku ]
      properties:
        sku:
          type: string
          minLength: 1
