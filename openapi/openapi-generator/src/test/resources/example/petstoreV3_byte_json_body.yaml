openapi: "3.0.3"
info:
  version: 1.0.0
  title: Byte JSON bodies
paths:
  /bytes/ref:
    post:
      operationId: postRefBytes
      tags: [bytes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Base64Data'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Base64Data'
  /bytes/inline:
    post:
      operationId: postInlineBytes
      tags: [bytes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: byte
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: string
                format: byte
components:
  schemas:
    Base64Data:
      type: string
      format: byte
