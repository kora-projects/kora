sourceSets {
    maybeCreate("testGenerated").java {
        srcDirs(
            openapiPaths.collectMany { path ->
                [
                    layout.buildDirectory.dir("out/$path/java-client"),
                    layout.buildDirectory.dir("out/$path/java-server")
                ]
            }
        )
    }
}

pluginManager.withPlugin("org.jetbrains.kotlin.jvm") {
    def kotlinExtension = extensions.getByType(org.jetbrains.kotlin.gradle.dsl.KotlinJvmProjectExtension)
    kotlinExtension.sourceSets.maybeCreate("testGenerated").kotlin {
        srcDirs(
            openapiPaths.collectMany { path ->
                [
                    layout.buildDirectory.dir("out/$path/kotlin-client"),
                    layout.buildDirectory.dir("out/$path/kotlin-server")
                ]
            }
        )
    }
}

tasks.named("test", Test) {
