plugins {
    alias(libs.plugins.jmh)
}

dependencies {
    implementation project(":database:database-common")
    implementation project(":database:database-jdbc-agroal")
    implementation project(":database:database-jdbc-hikari")
    implementation libs.jdbc.postgresql
    implementation libs.testcontainers.postgresql
}

jmh {
    includes = [project.findProperty("jmhInclude") ?: "JdbcPoolBenchmark"]
    benchmarkMode = (project.findProperty("jmhMode") ?: "thrpt,sample").split(",") as List
    timeUnit = project.findProperty("jmhTimeUnit") ?: "us"
    warmupIterations = (project.findProperty("jmhWarmupIterations") ?: "2") as int
    iterations = (project.findProperty("jmhIterations") ?: "3") as int
    fork = (project.findProperty("jmhForks") ?: "1") as int
    threads = (project.findProperty("jmhThreads") ?: "1") as int
}

tasks.register("jdbcPoolBenchmark", JavaExec) {
    group = "benchmark"
    description = "Runs JDBC pool JMH benchmarks with one PostgreSQL Testcontainer for the whole run."
    dependsOn tasks.named("jmhJar")
    classpath = files(tasks.named("jmhJar").flatMap { it.archiveFile }) + sourceSets.jmh.runtimeClasspath
    mainClass = "io.koraframework.database.jdbc.benchmark.JdbcPoolBenchmarkRunner"
    systemProperty "jmh.include", project.findProperty("jmhInclude") ?: "JdbcPoolBenchmark"
    systemProperty "jmh.mode", project.findProperty("jmhMode") ?: "thrpt,sample"
    systemProperty "jmh.warmupIterations", project.findProperty("jmhWarmupIterations") ?: "2"
    systemProperty "jmh.iterations", project.findProperty("jmhIterations") ?: "3"
    systemProperty "jmh.warmupSeconds", project.findProperty("jmhWarmupSeconds") ?: "5"
    systemProperty "jmh.measurementSeconds", project.findProperty("jmhMeasurementSeconds") ?: "10"
    systemProperty "jmh.forks", project.findProperty("jmhForks") ?: "1"
    systemProperty "jmh.threads", project.findProperty("jmhThreads") ?: "1"
}
