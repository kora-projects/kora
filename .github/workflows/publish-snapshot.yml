name: Publish Snapshot

on:
  workflow_run:
    workflows:
      - Build Master
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: JDK 25 setup
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v6

      - name: Gradle artifact
        run: ./gradlew assemble --console colored

      - name: Gradle publish
        run: ./gradlew publishMavenPublicationToSnapshotRepository --console colored
        env:
          KORA_IO_SIGNING_KEY: ${{ secrets.KORA_IO_SIGNING_KEY }}
          KORA_IO_SIGNING_PASSWORD: ${{ secrets.KORA_IO_SIGNING_PASSWORD }}
          SONATYPE_KORA_IO_USERNAME: ${{ secrets.SONATYPE_KORA_IO_USERNAME }}
          SONATYPE_KORA_IO_PASSWORD: ${{ secrets.SONATYPE_KORA_IO_PASSWORD }}
