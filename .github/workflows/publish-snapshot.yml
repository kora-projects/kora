name: Publish Snapshot

on:
  workflow_run:
    workflows:
      - Build Master
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: JDK 25 setup
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle artifact
        run: ./gradlew assemble --no-daemon --parallel

      - name: Gradle publish
        run: ./gradlew publishMavenPublicationToSnapshotRepository -Psigning.secretKeyRingFile=/tmp/secring.gpg --no-daemon --parallel
        env:
          KORA_IO_SIGNING_KEY: ${{ secrets.KORA_IO_SIGNING_KEY }}
          KORA_IO_SIGNING_PASSWORD: ${{ secrets.KORA_IO_SIGNING_PASSWORD }}
          SONATYPE_KORA_IO_USERNAME: ${{ secrets.SONATYPE_KORA_IO_USERNAME }}
          SONATYPE_KORA_IO_PASSWORD: ${{ secrets.SONATYPE_KORA_IO_PASSWORD }}
