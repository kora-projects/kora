name: Run tests (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-without-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: JDK 25 setup
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Gradle Compile and Cache
        uses: burrunan/gradle-cache-action@404534c34a2faa40430357a3183522a845b04f3b
        with:
          job-id: compile-step
          arguments: build -x test --console plain
          save-gradle-dependencies-cache: false
          save-local-build-cache: false
          read-only: false
          remote-build-cache-proxy-port: 34567

  run-tests:
    needs: build-without-test
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        task: [ 'postgres', 'cassandra', 'redis', 'kafka', 'openapi', 'codegen-kotlin-1', 'codegen-kotlin-2', 'codegen-java', 'other' ]
    steps:
      - uses: actions/checkout@v5

      - name: JDK 25 setup
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Gradle Run Matrix Tests
        uses: burrunan/gradle-cache-action@404534c34a2faa40430357a3183522a845b04f3b
        with:
          job-id: test-${{ matrix.task }}
          arguments: test-${{ matrix.task }} --console plain
          save-gradle-dependencies-cache: false
          save-local-build-cache: false
          read-only: false
          remote-build-cache-proxy-port: 34567

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.task }}
          path: '**/test-results/**/*.xml'
          retention-days: 7
