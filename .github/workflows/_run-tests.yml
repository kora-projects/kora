name: Run tests (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        task: [ 'postgres', 'cassandra', 'redis', 'kafka', 'openapi', 'codegen-kotlin', 'codegen-java', 'other' ]
    steps:
      - uses: actions/checkout@v4
      - name: JDK 25 setup
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          gradle-home-cache-cleanup: ${{ github.ref == 'refs/heads/master' }}

      - name: Gradle ${{ matrix.task }} classes
        run: ./gradlew classes-${{ matrix.task }} --no-daemon --parallel
        shell: bash

      - name: Gradle ${{ matrix.task }} javadoc
        run: ./gradlew javadoc-${{ matrix.task }} --no-daemon --parallel
        shell: bash

      - name: Gradle ${{ matrix.task }} test classes
        run: ./gradlew testClasses-${{ matrix.task }} --no-daemon --parallel
        shell: bash

      - name: Gradle ${{ matrix.task }} test
        run: ./gradlew test-${{ matrix.task }} --no-daemon --parallel
        shell: bash

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.task }}
          path: '**/test-results/**/*.xml'
          retention-days: 7
