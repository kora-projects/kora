name: Run tests (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        task: [
          'codegen-java-postgres-cassandra-redis-kafka',
          'openapi-1',
          'openapi-2',
          'codegen-kotlin-1',
          'codegen-kotlin-2',
          'codegen-kotlin-3',
          'codegen-kotlin-4',
          'other'
        ]
    steps:
      - uses: actions/checkout@v5

      - name: JDK 25 setup
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Gradle Run Matrix Tests
        uses: burrunan/gradle-cache-action@404534c34a2faa40430357a3183522a845b04f3b
        with:
          job-id: test-${{ matrix.task }}
          arguments: test-${{ matrix.task }} --console=colored
          save-gradle-dependencies-cache: true
          save-local-build-cache: true
          read-only: false

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.task }}
          path: '**/test-results/**/*.xml'
          retention-days: 7
